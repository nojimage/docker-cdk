name: Auto Release on PR Merge

on:
  pull_request:
    types: [closed]
    branches:
      - v2.22

jobs:
  create-release:
    # Only executed when PR is merged
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get CDK version from PR
        id: get-version
        run: |
          # Extract CDK version from PR title
          PR_TITLE="${{ github.event.pull_request.title }}"
          CDK_VERSION=$(echo "$PR_TITLE" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          
          if [ -z "$CDK_VERSION" ]; then
            # Retrieved from .cdk-version file
            CDK_VERSION=$(cat .cdk-version)
          fi
          
          echo "CDK Version: $CDK_VERSION"
          
          # Generating version number
          CDK_MAJOR=$(echo $CDK_VERSION | cut -d. -f1)
          CDK_MINOR=$(echo $CDK_VERSION | cut -d. -f2)
          CDK_PATCH=$(echo $CDK_VERSION | cut -d. -f3)
          NODE_VERSION="22"
          
          # Generating tag versions（e.g. CDK 2.1031.0 -> 2.22.103100）
          # CDK patch version is 0-padded to 2 digits and concatenated
          CDK_PATCH_PADDED=$(printf "%02d" $CDK_PATCH)
          TAG_VERSION="${CDK_MAJOR}.${NODE_VERSION}.${CDK_MINOR}${CDK_PATCH_PADDED}"
          
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "cdk_version=$CDK_VERSION" >> $GITHUB_OUTPUT
          echo "Tag version: $TAG_VERSION"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: ${{ github.event.pull_request.head.sha }}
          tag: v${{ steps.get-version.outputs.tag_version }}
          name: Release ${{ steps.get-version.outputs.tag_version }}
          body: |
            ## 🚀 Docker CDK Release
            
            ### Versions
            - **AWS CDK Toolkit CLI**: ${{ steps.get-version.outputs.cdk_version }}
            - **Node.js**: 22.x
            - **Base Image**: amazon/aws-sam-cli-build-image-nodejs22.x
            
            ### What's Changed
            - Updated AWS CDK Toolkit CLI to version ${{ steps.get-version.outputs.cdk_version }}
            
            ### Docker Image
            ```bash
            docker pull ghcr.io/nojimage/docker-cdk:${{ steps.get-version.outputs.tag_version }}
            ```
            
            ### Full Changelog
            See [AWS CDK Toolkit CLI Release Notes](https://github.com/aws/aws-cdk-cli/releases/tag/aws-cdk%40v${{ steps.get-version.outputs.cdk_version }})
          draft: true
          prerelease: false